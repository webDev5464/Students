<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <!--! block element -->

  <h1></h1>
  <p></p>

  <!--! Inline Element -->

  <span></span>
  <a href=""></a>
  <img src="" alt="">
  <b></b>
  <i></i>

  <!--! Examples -->

  <h1>Hello <span style="color: red;">World!</span></h1>

  <span>Hello <h1>World!</h1></span>

  <p>Lorem ipsum <a href="">dolor</a> sit amet.</p>

  <!--! Order list and unorder list -->

  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <ol type="I">
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ol>

  <!--! Nesting list -->

  <ul>
    <li>Tea
      <ul>
        <li>Lemon Tea</li>
        <li>Black Tea</li>
      </ul>
    </li>

    <li>Coffee
      <ul>
        <li>Espresso</li>
        <li>Hot Coffee</li>
      </ul>
    </li>
  </ul>

</body>

</html>
